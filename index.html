 lectura: `## 1. ¿De dónde vienen nuestros derechos?
En Ecuador los derechos de los trabajadores están en la Constitución, en el Código del Trabajo y en otras leyes. La Constitución reconoce el trabajo como un derecho y establece que todas las personas somos iguales ante la ley y no podemos ser discriminadas (Art. 11, numeral 2). También dice que a trabajo de igual valor corresponde igual remuneración (Art. 326, numeral 4). El Código del Trabajo repite la idea: a trabajo igual, remuneración igual, sin discriminar por sexo, edad, etnia, religión, orientación sexual, estado de salud, discapacidad u otra diferencia (Art. 79).

## 2. Derechos que tenemos todos
- Contrato y afiliación: tener un contrato y estar afiliado al IESS desde el primer día de trabajo.
- Remuneración: cobrar al menos el salario básico (o el sectorial que corresponda) y recibir el pago a tiempo.
- Décimo tercero y décimo cuarto sueldo, y fondos de reserva desde el segundo año de trabajo.
- Jornada: la jornada máxima es de 8 horas diarias y 40 semanales. Lo que pasa de ahí es sobretiempo y se paga con recargo.
- Descanso y vacaciones: dos días de descanso a la semana y 15 días de vacaciones pagadas al año (más días según la antigüedad).
- Protección de la maternidad y la paternidad: licencia de maternidad de 12 semanas y licencia de paternidad. Una mujer embarazada no puede ser despedida por estar embarazada.
- Un trabajo seguro: el empleador debe cuidar tu seguridad y salud (por ejemplo, entregar implementos de protección al personal de limpieza y jardinería).
- Trato digno: nadie puede ser insultado, humillado ni maltratado en el trabajo.

Importante: los montos y plazos exactos cambian. Para cifras concretas (salario básico del año, días de licencia por casos especiales) se consulta siempre el Ministerio del Trabajo o un abogado laboral.

## 3. Derechos de mujeres y hombres: iguales, pero con necesidades distintas
Igualdad no significa tratar a todos exactamente igual en todo, sino darle a cada persona las mismas oportunidades. Una mujer embarazada necesita licencia y cuidados; un padre necesita tiempo para acompañar a su hijo recién nacido. Cuando la ley protege la maternidad, no está dando un "privilegio": está evitando que una mujer pierda su trabajo por tener un hijo.

## 4. Obligaciones de las personas trabajadoras
Los derechos vienen con responsabilidades: cumplir el horario, cuidar los bienes de la etapa, tratar con respeto a vecinos y compañeros, y seguir las instrucciones razonables del empleador. Respetar al compañero o compañera también es parte del trabajo.

## 5. La Asociación como empleadora
La Asociación de Residentes es la empleadora. Su representante legal es el Presidente. El Administrador ejecuta el día a día, y la contadora lleva los registros. Esto significa que si algo no se cumple (un pago, una afiliación, un implemento de seguridad), el trabajador puede decirlo sin miedo y la Asociación debe corregirlo. Si no se resuelve, el trabajador puede acudir al Ministerio del Trabajo.

## 6. Por qué se hace esta capacitación
La Ley Orgánica para la Igualdad Salarial entre Mujeres y Hombres obliga a los empleadores a capacitar cada año, mínimo 40 horas, a todo su personal y a sus máximas autoridades. Por eso el Presidente y el directorio también estudian aquí.`,

 lectura: `## 1. Sexo y género: ¿qué diferencia hay?
El sexo tiene que ver con lo biológico (hombre, mujer). El género son las ideas que la sociedad pone sobre lo que "debe" hacer o ser un hombre o una mujer. Por ejemplo, creer que "cuidar niños es de mujeres" o que "mandar es de hombres" no es biología: es costumbre. Y las costumbres se pueden cambiar.

## 2. Los estereotipos en el trabajo
Un estereotipo es una idea fija sobre un grupo. En una urbanización puede verse así:
- Pensar que la limpieza es "trabajo de mujeres" y la jardinería o la seguridad "trabajo de hombres".
- Pensar que una mujer no puede ser administradora o guardia, o que un hombre no puede cuidar a sus hijos y pedir permiso para eso.
- Pensar que una mujer "se pone sentimental" y un hombre "no debe llorar ni pedir ayuda".
Estos estereotipos hacen daño a todos. Reducen las oportunidades de las mujeres y también presionan a los hombres a no cuidar de su familia ni de su salud.

## 3. Brecha y segregación
Cuando los puestos "de mujeres" suelen pagar menos que los "de hombres" aunque exijan responsabilidad parecida, hablamos de segregación y de brecha salarial. La Ley Orgánica para la Igualdad Salarial entre Mujeres y Hombres existe justamente para corregir esto en las empresas y organizaciones empleadoras.

## 4. Trabajo de cuidado
El trabajo no pagado de cuidar niños, adultos mayores o enfermos en casa recae sobre todo en las mujeres. Muchas llegan cansadas al trabajo remunerado después de una "segunda jornada" en casa. Si los hombres comparten el cuidado, las mujeres tienen más tiempo para estudiar, descansar o crecer en su empleo, y los hombres se acercan más a sus hijos.

## 5. Lenguaje y trato diario
La igualdad se nota en cosas pequeñas: cómo nos hablamos, a quién consultamos, a quién se le asignan las tareas pesadas, quién habla en las reuniones, qué chistes se cuentan. Un chiste que humilla a las mujeres (o a los hombres) también es parte del problema.

## 6. ¿Qué podemos hacer en la etapa?
- Asignar tareas según capacidades y necesidades del puesto, no según el sexo.
- Dar a mujeres y hombres las mismas oportunidades de capacitarse y de ascender.
- Respetar los permisos por cuidado de hijos y por salud, para ambos sexos.
- Corregir con respeto cuando alguien haga un comentario sexista.
- Revisar que los sueldos de puestos comparables sean justos (lo vemos en el Módulo 4).`,
 actividad: {

 },

 id: 3,
 titulo: "Erradicación de violencia y no discriminación en el centro de trabajo",
 objetivo: "Reconocer la violencia, el acoso y la discriminación en el trabajo, saber qué hacer si ocurren y conocer el protocolo que la etapa debe tener.",
 intro: "Nadie debe ser maltratado, acosado ni excluido en su trabajo. Esto incluye gritos, burlas, amenazas, tocamientos, insinuaciones sexuales y trato desigual por ser mujer, por la edad, la discapacidad, el origen o la orientación sexual. Aquí aprendemos a reconocerlo y a actuar.",
 video: { id: "E0rfyQDV-K4", titulo: "Más de 8.400 personas unidas contra la violencia laboral | Ministerio del Trabajo + PREVIMUJER", canal: "Canal Libre de Violencia", duracion: "No verificada", nota: "El título corresponde a una pieza del Ministerio del Trabajo con el programa PREVIMUJER (subida el 28/03/2025). El canal que la publicó es 'Canal Libre de Violencia', NO el canal oficial del Ministerio; y no se pudo confirmar la duración. El Administrador debe verificarlo antes del 23/11/2026. También existe como alternativa de ONU Mujeres: '#25N Violencia Basada en Género | Programa completo' (canal ONU Mujeres América Latina y el Caribe, https://www.youtube.com/watch?v=vm_uKtUNyPw), de alcance regional y duración no verificada." },
 lectura: `## 1. ¿Qué es la violencia en el trabajo?
Es cualquier conducta que cause daño físico, psicológico, sexual o económico a una persona en su lugar de trabajo o por razón de su trabajo. El Convenio 190 de la OIT, una norma internacional, habla de "violencia y acoso" en el mundo del trabajo y señala que afecta de forma especial a las mujeres.

## 2. Formas más comunes
- Violencia verbal: gritos, insultos, apodos humillantes, burlas.
- Violencia psicológica o acoso laboral: amenazas, aislar a alguien, quitarle funciones sin razón, vigilarlo todo el tiempo, desprestigiarlo ante los demás.
- Acoso sexual: comentarios sobre el cuerpo, insinuaciones, mensajes no deseados, tocamientos, o condicionar un beneficio laboral a un favor sexual.
- Violencia física: empujones, golpes, agresiones.
- Violencia económica: retener el pago, descontar sin autorización, impedir que alguien reciba lo que le corresponde.

## 3. Discriminación
Discriminar es tratar peor a una persona por una característica suya: sexo, edad, etnia, religión, discapacidad, orientación sexual, estado de salud, ser migrante u otras. La Constitución prohíbe la discriminación y el Código del Trabajo también. En la etapa podría verse como no contratar a alguien por tener hijos pequeños, dar peores turnos a una persona por su origen, o excluir a un compañero por su orientación sexual.

## 4. Lo que dicen las leyes
Ecuador cuenta, entre otras normas, con la Ley Orgánica Integral para Prevenir y Erradicar la Violencia contra las Mujeres y con reformas al Código del Trabajo para prevenir el acoso laboral. El Ministerio del Trabajo ha emitido normas para que los empleadores tengan un protocolo interno de prevención y atención. Importante: el Administrador y el directorio deben verificar con el Ministerio del Trabajo cuál es el acuerdo ministerial vigente y qué exige exactamente al sector privado, porque esta capacitación no reemplaza la lectura de la norma.

## 5. Si me pasa a mí
- Anótalo: fecha, hora, qué pasó, quién lo vio. Guarda mensajes o fotos.
- No te culpes: la responsabilidad es de quien agrede.
- Cuéntalo a una persona de confianza y a la persona designada por la Asociación (por ejemplo, el Administrador o un directivo que no esté involucrado).
- Si quien agrede es el propio Administrador o un directivo, debes poder acudir a otra persona de la directiva.
- Puedes acudir al Ministerio del Trabajo y, si hay delito, a la Fiscalía. Si estás en peligro inmediato, llama al 911.

## 6. Si lo veo o me lo cuentan
Escucha sin juzgar, no obligues a la persona a confrontar a quien la agrede, no divulgues lo que te contó y avisa a la persona responsable. Reservar los datos protege a la víctima.

## 7. Qué debe tener la etapa
Una etapa empleadora debería tener por escrito: una declaración de cero tolerancia, cómo se presenta una queja, quién la recibe, plazos, medidas de protección para la persona que reclama, y la garantía de que reclamar no traerá represalias. Esto se trabaja en la actividad del módulo.`,

 lectura: `## 1. Igual trabajo vs. trabajo de igual valor
Igual trabajo es cuando dos personas hacen lo mismo (dos conserjes en el mismo turno). Trabajo de igual valor es cuando los puestos son distintos pero valen parecido para la organización. La Constitución habla de "trabajo de igual valor" (Art. 326, numeral 4) y la ley de igualdad salarial desarrolla esta idea.

## 2. ¿Cómo se compara el valor de un puesto?
Un método común, que usa la OIT en sus guías, compara cuatro factores:
- Conocimientos y habilidades: estudios, experiencia, cursos que exige el puesto.
- Esfuerzo: físico, mental y emocional (cargar peso, atender reclamos, estar de pie muchas horas).
- Responsabilidad: por personas, dinero, bienes, seguridad o decisiones (por ejemplo, controlar el acceso a la etapa).
- Condiciones de trabajo: riesgos, sol, químicos, turnos nocturnos, ruido.
Se describe cada puesto, se le da una calificación por factor y se comparan.

## 3. Un ejemplo sencillo (inventado)
Puesto A (conserjería): responsabilidad alta (atiende a vecinos, controla llaves y áreas comunes), esfuerzo medio, condiciones medias. Puesto B (limpieza de áreas comunes): esfuerzo físico alto, condiciones con químicos y sol, responsabilidad media. Los puestos son distintos, pero al sumar los factores pueden tener un valor parecido. Si el puesto A lo ocupan casi siempre hombres y el B casi siempre mujeres, y el B paga menos sin una razón objetiva, hay una alerta de posible discriminación salarial.

## 4. Razones que SÍ justifican diferencias
Pueden existir diferencias objetivas: antigüedad, formación comprobada, desempeño medible, más responsabilidades o más horas. Lo que NO es válido es justificar una diferencia por el sexo, la edad, el origen o por "costumbre".

## 5. Pasos para revisar la equidad en la etapa
1. Hacer la lista de puestos y personas (sin juzgar todavía).
2. Escribir una descripción corta de cada puesto.
3. Calificar los cuatro factores con un criterio común.

5. Pedir explicación objetiva de cada diferencia.
6. Corregir lo que no se pueda justificar, y dejar constancia por escrito.
Esto debe hacerlo la Asociación con asesoría de la contadora y, si es necesario, un abogado laboral. Esta capacitación enseña la idea; no reemplaza ese análisis.

## 6. Otras prácticas de equidad
- Publicar con claridad los criterios de pago por cargo.

- Facilitar permisos de cuidado para mujeres y hombres.
- Revisar con regularidad que los cambios de sueldo se basen en criterios claros.

## 7. La acción de sensibilización (Art. 4)

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let quizSet = {};
function quizBlock(m) {
  const u = U(), q = u.quiz[m]; let h = '<div class="card"><h3>Evaluación del módulo ' + m + '</h3>';
  if (q && q.passed) return h + '<div class="msg ok">Aprobada con ' + q.best + ' de 10. Intentos: ' + q.intentos.length + '.</div></div>';

function gradeQuiz(m) {
  const set = quizSet[m]; let ok = 0;
  for (let n = 0; n < set.length; n++) { const r = document.querySelector('input[name="q' + n + '"]:checked'); if (!r) { alert('Falta responder la pregunta ' + (n + 1) + '.'); return; } if (+r.value === MODS[m - 1].quiz[set[n]].c) ok++; }
  const u = U(); const q = u.quiz[m] || { best: 0, passed: false, intentos: [] };
  q.intentos.push({ fecha: new Date().toISOString(), nota: ok }); q.best = Math.max(q.best || 0, ok);
  enqSesion(cur); enq({ k: 'q|' + m + '|' + q.intentos.length, t: 'quiz', m: m, n: q.intentos.length, nota: ok, fecha: new Date().toISOString() });

  q.passed = false; u.quiz[m] = q;
  for (let l = 0; l < 5; l++) { const p = prog(u, m, l); p.done = false; p.secs = 0; p.intento = (p.intento || 1) + 1; }
  save(); enq({ t: 'reset', m: m, intento: prog(u, m, 0).intento }); flush(); alert('Nota: ' + ok + ' de 10. Necesitas 7 para aprobar. Debes repetir el módulo ' + m + '. Tu tiempo anterior queda registrado como evidencia.'); go('modulo', { m: m });
}
